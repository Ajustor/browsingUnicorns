name: Pages

# Rebuild the download page when its sources change on master, without waiting
# for the next release. The site is rebuilt from the latest stable release's
# assets (each deploy replaces the whole site).
on:
  push:
    branches: [master]
    paths:
      - 'pages/**'
      - 'CHANGELOG.md'
      - 'scripts/changelog.py'
      - 'scripts/build-pages.py'
      - 'scripts/build-site.sh'
      - 'scripts/sign-manifest.py'
      - 'crates/updater/update-signing-key.pub'
      - 'scripts/install.sh'
      - 'scripts/install.ps1'
      - 'scripts/install-macos.sh'
      - 'assets/icon.png'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Find latest stable release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases \
            --limit 1 --json tagName --jq '.[0].tagName // empty')
          if [ -z "$tag" ]; then
            echo "::error::No stable release to publish"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # A version bump merged before its tag: the release workflow will
          # publish that version. Deploying the previous release now would
          # also block it, since Pages ignores a second deploy of the same
          # commit (both runs build the merge commit).
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [ "v$version" != "$tag" ]; then
            echo "Cargo.toml is at $version but the latest release is $tag: the release will publish the site."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Download release assets
        if: steps.release.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${{ steps.release.outputs.tag }}" --repo "$GITHUB_REPOSITORY" --dir artifacts
      - id: pages
        if: steps.release.outputs.skip != 'true'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Build site
        if: steps.release.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_URL: ${{ steps.pages.outputs.base_url }}
          # Ed25519 key signing latest.json (scripts/sign-manifest.py).
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: bash scripts/build-site.sh "${{ steps.release.outputs.tag }}" "$BASE_URL" artifacts
      # One artifact name per attempt: a re-run would otherwise find the
      # previous attempt's "github-pages" too, and deploy-pages refuses two.
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        if: steps.release.outputs.skip != 'true'
        with:
          path: site
          name: github-pages-${{ github.run_attempt }}
      - id: deploy
        if: steps.release.outputs.skip != 'true'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
