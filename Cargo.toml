[package]
name = "browsing-unicorns"
version = "0.20.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "A light and fast web browser written in Rust"

[[bin]]
name = "browsingUnicorns"
path = "src/main.rs"

[workspace]
members = ["crates/domain", "crates/application", "crates/infrastructure", "crates/updater", "crates/mobile", "crates/i18n"]

[workspace.package]
edition = "2024"
# let-chains
rust-version = "1.89"
license = "MIT"

[workspace.dependencies]
domain = { path = "crates/domain" }
application = { path = "crates/application" }
infrastructure = { path = "crates/infrastructure", default-features = false }
updater = { path = "crates/updater" }
i18n = { path = "crates/i18n" }

[dependencies]
domain.workspace = true
application.workspace = true
infrastructure = { workspace = true, features = ["desktop"] }
updater.workspace = true
i18n.workspace = true
eframe = { version = "0.31", features = ["default"] }
egui = "0.31"
egui-phosphor = "0.9"
# Sync pairing code as a QR code (drawn with egui).
qrcode = { version = "0.14", default-features = false }
anyhow = "1"
log = "0.4"
env_logger = "0.11"
image = { version = "0.25", default-features = false, features = ["png"] }
# The system's file and folder pickers (extensions installed by hand).
rfd = "0.18"
# The system's language, for the interface's when it follows it.
sys-locale = "0.3"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
# Embeds assets/icon.ico in the Windows executable (see build.rs).
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
