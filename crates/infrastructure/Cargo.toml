[package]
name = "infrastructure"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Adapters for the application ports: system web view, profile files, sync."

[features]
default = ["desktop"]
# The system web view (wry) and the HTTP sync transport. The Android app
# brings its own WebView and HTTP client, and builds without it.
desktop = [
    "dep:wry",
    "dep:rfd",
    "dep:raw-window-handle",
    "dep:gtk",
    "dep:ureq",
    "dep:webview2-com",
    "dep:windows-core",
    "dep:windows",
    "dep:webkit2gtk",
    "dep:webkit2gtk-sys",
    "dep:glib",
    "dep:glib-sys",
    "dep:gio-sys",
    "dep:gobject-sys",
    "dep:objc2",
    "dep:objc2-foundation",
    "dep:objc2-web-kit",
    "dep:block2",
    "dep:x509-parser",
    "dep:libc",
]

[dependencies]
i18n.workspace = true
domain.workspace = true
application.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "6"
log = "0.4"
# Sync: end-to-end encryption of the records, ids derived from the key.
chacha20poly1305 = "0.10"
sha2 = "0.10"
data-encoding = "2"
# The OS web view (WebView2 / WKWebView / WebKitGTK): no engine to ship.
# `devtools`: the web inspector in release builds too.
wry = { version = "0.57", optional = true, features = ["devtools"] }
# The "save as" dialog of downloads.
rfd = { version = "0.18", optional = true }
raw-window-handle = { version = "0.6", optional = true }
# `platform-verifier`: the system's certificates (corporate proxies...).
ureq = { version = "3", features = ["platform-verifier"], optional = true }
# The sites' certificates, shown from the padlock.
x509-parser = { version = "0.18", optional = true }
# Extensions: unpacking the .crx (a zip after a signed header).
zip = { version = "9.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# The built-in ad blocker (Brave's engine). Without `single-thread`, the
# engine is Send + Sync, shared by the request hooks; `content-blocking`:
# WebKit's rule format.
adblock = { version = "0.13", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling", "content-blocking"] }

# A child web view on Linux needs GTK initialised and its loop advanced.
# WebKitGTK's content filters (extensions' rules) through its C API: the
# Rust bindings leave them out. Same versions as wry.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", optional = true }
webkit2gtk = { version = "=2.0.2", features = ["v2_38"], optional = true }
webkit2gtk-sys = { version = "=2.0.2", features = ["v2_38"], optional = true }
glib = { version = "0.18", optional = true }
glib-sys = { version = "0.18", optional = true }
gio-sys = { version = "0.18", optional = true }
gobject-sys = { version = "0.18", optional = true }

# WKWebView's content rule lists (extensions' rules). Same versions as wry.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", optional = true }
objc2-foundation = { version = "0.3", features = ["NSString", "NSError", "NSArray"], optional = true }
objc2-web-kit = { version = "0.3", features = [
    "block2",
    "WKContentRuleList",
    "WKContentRuleListStore",
    "WKUserContentController",
    "WKUserScript",
], optional = true }
block2 = { version = "0.6", optional = true }

# Managing the extensions of the WebView2 profile (same versions as wry).
[target.'cfg(windows)'.dependencies]
webview2-com = { version = "0.39", optional = true }
windows-core = { version = "0.62", optional = true }
# The network rules' answers (SHCreateMemStream for a stand-in's body).
# Threading: whether the process of a private window's leftover still runs.
# Gdi: the page's window region, cut where the browser's menus fall.
# LibraryLoader: the executable's icon for the taskbar.
# Security_Cryptography: the saved passwords, sealed for the Windows user (DPAPI).
windows = { version = "0.62", features = ["Win32_Security_Cryptography","Win32_UI_Shell", "Win32_System_Com", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Registry", "Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader"], optional = true }

# Whether the process of a private window's leftover still runs (`kill(pid, 0)`).
[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

[dev-dependencies]
tempfile = "3"
